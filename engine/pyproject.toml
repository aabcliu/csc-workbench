[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csc-engine"
version = "0.1.0"
description = "Runtime engine for the distributable CSC Web Workbench"
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.15.0",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.18,<5",
    "rfc3339-validator>=0.1.4,<1",
]

[tool.setuptools.packages.find]
include = ["csc_engine*"]
